<!DOCTYPE html>
<html>
<head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Yash &amp; Co. - Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
        <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
</head>

<body>
    <section id="header">
            <a class="brand" href="index.html"><img src="img/logo.svg" class="logo" alt="Yash &amp; Co. Jewellers" width="180" height="49"></a>
            <ul id="navbar">
                <li class="nav-search">
                    <form role="search">
                        <i class="fas fa-search"></i>
                        <input id="search" type="search" placeholder="Search jewellery" aria-label="Search jewellery">
                    </form>
                </li>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a class="active" href="login.html">Login</a></li>
                <li id="lg-bag"><a href="cart.html" aria-label="Cart"><i class="fas fa-shopping-bag"></i></a></li>
                <a href="#" id="close" aria-label="Close menu"><i class="fas fa-times"></i></a>
            </ul>
            <div id="mobile">
                <a href="cart.html" aria-label="Cart"><i class="fas fa-shopping-bag"></i></a>
                <i id="bar" class="fas fa-bars" aria-label="Open menu"></i>
            </div>
        </section>

    <div class="account-page">
        <div class="form-container">
            <form id="LoginForm" >
                <h2>Login</h2>
                <input type="text" placeholder="Username" required="required" name="username">
                <input type="password" placeholder="Password" required="required" name="password">
                <button type="submit" class="btn">Login</button>
                <p class="switch-form" onclick="redirectToRegister()">Don't have an account? Register here</p>
            </form>

        </div>
    </div>
    
    <script>
        function redirectToRegister() {
            window.location.href = "register.html";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        var loginForm = document.getElementById("LoginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault(); 

            var username = document.getElementsByName("username")[0].value;
            var password = document.getElementsByName("password")[0].value;

            if (username === "admin" && password === "admin") {
                Toastify({
                    text: "Successfully logged in",
                    duration: 3000, 
                    gravity: "top", 
                    position: "center", 
                    backgroundColor: "green", 
                }).showToast();
              
                setTimeout(function() {
                    window.location.href = "admin.html";
                }, 3000);
            } else if (username === "admin" && password !== "admin") {
                Toastify({
                    text: "Wrong password",
                    duration: 3000, 
                    gravity: "top", 
                    position: "center", 
                    backgroundColor: "red", 
                }).showToast();
            } else {
                Toastify({
                    text: "Successfully logged in",
                    duration: 3000, 
                    gravity: "top", 
                    position: "center", 
                    backgroundColor: "green", 
                }).showToast();
                
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 3000);
            }
            
            
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
