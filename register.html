<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Yash-Jewellery - Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logon.png" class="logo" alt="Yash-Jewellery" width="80" height="80"></a>

        <div>
            <ul id="navbar">
                <li><a  href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a  class="active" href="register.html">Register</a></li>
                <li><a  href="login.html">Login</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-bag"></i></a></li>
            </ul>
        </div>
    </section>

    <div class="account-page">
        <div class="form-container">
            <form id="RegForm" >
                <h2>Register</h2>
                <input type="text" placeholder="Username" required="required" name="fname">
                <input type="email" placeholder="Email" required="required" name="email">
                <input type="password" placeholder="Password" required="required" name="password">
                <button type="submit" class="btn">Register</button>
                <p class="switch-form" onclick="redirectToLogin()">Already have an account? Login here</p>
            </form>
        </div>
    </div>
    
    <script>
        function redirectToLogin() {
            window.location.href = "login.html";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        var regForm = document.getElementById("RegForm");

        regForm.addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent form submission

            // Show toast notification
            Toastify({
                text: "Successfully registered",
                duration: 3000, 
                gravity: "top", 
                position: "center", 
                backgroundColor: "green",
            }).showToast();
            
            setTimeout(function() {
                window.location.href = "index.html";
            }, 3000);
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
